type AuthPayload {
  token: String!
  user: User!
}

type Comment {
  author: User
  authorId: ID
  body: String!
  createdAt: DateTime!
  id: ID!
  issueId: ID!
  updatedAt: DateTime!
}

input CreateCommentInput {
  body: String!
  issueId: ID!
}

input CreateCustomerInput {
  annualRevenue: Int
  domains: [String!]
  name: String!
  ownerId: ID
  size: String
  status: CustomerStatus
  tier: CustomerTier
}

input CreateIssueInput {
  assigneeId: ID
  description: String
  dueDate: Date

  """Points: 0, 1, 2, 3, 5 or 8"""
  estimate: Int
  labelIds: [ID!]

  """Makes this issue a sub-issue; the parent must be in the same project"""
  parentId: ID
  priority: IssuePriority
  projectId: ID!

  """The release must belong to the same project"""
  releaseId: ID
  status: IssueStatus
  title: String!
}

input CreateProjectInput {
  description: String

  """2-5 letters, used as the issue identifier prefix"""
  key: String!
  leadId: ID
  memberIds: [ID!]
  name: String!
  priority: ProjectPriority
  startDate: Date
  status: ProjectStatus
  targetDate: Date
}

input CreateReleaseInput {
  description: String
  name: String!
  pipelineId: ID!
  status: ReleaseStatus
  targetDate: Date
  version: String
}

input CreateReleasePipelineInput {
  name: String!
  projectId: ID!
  type: ReleasePipelineType
}

input CreateRequestInput {
  customerId: ID
  description: String
  projectId: ID!
  requestor: String!
  source: RequestSource
  title: String!
}

type Customer {
  """Annual revenue in whole dollars"""
  annualRevenue: Int
  createdAt: DateTime!
  domains: [String!]!
  id: ID!
  name: String!
  owner: User
  ownerId: ID
  requestCount: Int!
  size: String
  status: CustomerStatus!
  tier: CustomerTier
}

type CustomerRequest {
  convertedIssue: Issue

  """Set once this request has been converted into an issue"""
  convertedIssueId: ID
  createdAt: DateTime!
  customer: Customer
  customerId: ID
  description: String!
  id: ID!
  project: Project!
  projectId: ID!
  requestor: String!
  source: RequestSource!
  status: RequestStatus!
  title: String!
  updatedAt: DateTime!
}

enum CustomerStatus {
  ACTIVE
  CHURNED
  LOST
  PROSPECT
}

enum CustomerTier {
  TIER_1
  TIER_2
  TIER_3
}

"""Calendar date in YYYY-MM-DD format"""
scalar Date

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

input InviteMembersInput {
  emails: [String!]!
  role: UserRole
}

type InvitedMember {
  """Shown once at invite time; not recoverable afterwards"""
  temporaryPassword: String!
  user: User!
}

type Issue {
  assignee: User
  assigneeId: ID
  comments: [Comment!]!
  completedAt: DateTime
  createdAt: DateTime!
  creator: User
  creatorId: ID
  description: String!
  dueDate: Date

  """Points: 0, 1, 2, 3, 5 or 8. Null means no estimate."""
  estimate: Int
  id: ID!
  identifier: String!
  labels: [Label!]!
  number: Int!
  parent: Issue
  parentId: ID
  priority: IssuePriority!
  project: Project!
  projectId: ID!
  release: Release
  releaseId: ID
  status: IssueStatus!

  """Null when the issue has no sub-issues"""
  subIssueProgress: Progress
  subIssues: [Issue!]!
  title: String!
  updatedAt: DateTime!
}

enum IssuePriority {
  HIGH
  LOW
  MEDIUM
  NO_PRIORITY
  URGENT
}

enum IssueStatus {
  BACKLOG
  BLOCKED
  CANCELED
  DONE
  IN_PROGRESS
  IN_REVIEW
  TODO
}

input IssuesFilterInput {
  assigneeId: ID

  """Only direct sub-issues of this issue"""
  parentId: ID
  projectId: ID
  releaseId: ID

  """Case-insensitive match on the title"""
  search: String
  statuses: [IssueStatus!]

  """Exclude sub-issues"""
  topLevelOnly: Boolean
}

type Label {
  color: String!
  createdAt: DateTime!
  id: ID!
  name: String!
}

input LoginInput {
  email: String!
  password: String!
}

type Mutation {
  """Links this request to an existing issue and marks it converted"""
  convertRequestToIssue(id: ID!, issueId: ID!): CustomerRequest!
  createComment(input: CreateCommentInput!): Comment!
  createCustomer(input: CreateCustomerInput!): Customer!
  createIssue(input: CreateIssueInput!): Issue!
  createProject(input: CreateProjectInput!): Project!
  createRelease(input: CreateReleaseInput!): Release!
  createReleasePipeline(input: CreateReleasePipelineInput!): ReleasePipeline!
  createRequest(input: CreateRequestInput!): CustomerRequest!
  deleteComment(id: ID!): Comment!
  deleteCustomer(id: ID!): Customer!

  """Sub-issues of the deleted issue become top-level issues"""
  deleteIssue(id: ID!): Issue!
  deleteProject(id: ID!): Project!
  deleteRelease(id: ID!): Release!
  deleteReleasePipeline(id: ID!): ReleasePipeline!
  deleteRequest(id: ID!): CustomerRequest!

  """
  Admin only. Returns each invited member with a one-time temporary password.
  """
  inviteMembers(input: InviteMembersInput!): [InvitedMember!]!
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): AuthPayload!

  """Admin only."""
  removeMember(id: ID!): User!
  updateCustomer(id: ID!, input: UpdateCustomerInput!): Customer!
  updateIssue(id: ID!, input: UpdateIssueInput!): Issue!
  updateProject(id: ID!, input: UpdateProjectInput!): Project!
  updateRelease(id: ID!, input: UpdateReleaseInput!): Release!
  updateReleasePipeline(id: ID!, input: UpdateReleasePipelineInput!): ReleasePipeline!
  updateRequest(id: ID!, input: UpdateRequestInput!): CustomerRequest!
}

type Progress {
  completed: Int!
  total: Int!
}

type Project {
  createdAt: DateTime!
  description: String!
  id: ID!
  key: String!
  lead: User
  leadId: ID
  members: [User!]!
  name: String!
  priority: ProjectPriority!
  progress: Progress!
  startDate: Date
  status: ProjectStatus!
  targetDate: Date
  updatedAt: DateTime!
}

enum ProjectPriority {
  HIGH
  LOW
  MEDIUM
  NO_PRIORITY
  URGENT
}

enum ProjectStatus {
  BACKLOG
  CANCELED
  COMPLETED
  IN_PROGRESS
  PLANNED
}

type Query {
  customer(id: ID!): Customer!
  customers: [Customer!]!
  issue(id: ID!): Issue!

  """Look up an issue by its human readable identifier, e.g. ENG-12"""
  issueByIdentifier(identifier: String!): Issue!
  issues(filter: IssuesFilterInput): [Issue!]!
  labels: [Label!]!
  me: User!
  project(id: ID!): Project!
  projects: [Project!]!
  release(id: ID!): Release!
  releasePipeline(id: ID!): ReleasePipeline!
  releasePipelines(projectId: ID): [ReleasePipeline!]!
  releases(projectId: ID): [Release!]!
  request(id: ID!): CustomerRequest!
  requests(customerId: ID, projectId: ID): [CustomerRequest!]!
  users: [User!]!
}

input RegisterInput {
  email: String!
  name: String!
  password: String!
}

type Release {
  createdAt: DateTime!
  description: String!
  id: ID!
  name: String!
  pipeline: ReleasePipeline!
  pipelineId: ID!
  progress: Progress!
  project: Project!
  projectId: ID!
  releasedAt: DateTime
  status: ReleaseStatus!
  targetDate: Date
  updatedAt: DateTime!
  version: String
}

type ReleasePipeline {
  createdAt: DateTime!
  id: ID!
  latestRelease: Release
  name: String!
  project: Project!
  projectId: ID!
  releaseCount: Int!
  type: ReleasePipelineType!
  updatedAt: DateTime!
}

enum ReleasePipelineType {
  CONTINUOUS
  SCHEDULED
}

enum ReleaseStatus {
  CANCELED
  COMPLETED
  IN_PROGRESS
  PLANNED
}

enum RequestSource {
  EXTERNAL
  INTERNAL
}

enum RequestStatus {
  CONVERTED
  DECLINED
  OPEN
}

input UpdateCustomerInput {
  """Pass null to clear"""
  annualRevenue: Int

  """Replaces the full domain list"""
  domains: [String!]
  name: String

  """Pass null to unassign"""
  ownerId: ID

  """Pass null to clear"""
  size: String
  status: CustomerStatus

  """Pass null to clear"""
  tier: CustomerTier
}

input UpdateIssueInput {
  """Pass null to unassign"""
  assigneeId: ID
  description: String

  """Pass null to clear"""
  dueDate: Date

  """Points: 0, 1, 2, 3, 5 or 8. Pass null to clear."""
  estimate: Int

  """Replaces the full label list"""
  labelIds: [ID!]

  """Pass null to turn a sub-issue back into a top-level issue"""
  parentId: ID
  priority: IssuePriority

  """Move the issue to a different project; clears parentId and releaseId"""
  projectId: ID

  """Pass null to remove from the release"""
  releaseId: ID
  status: IssueStatus
  title: String
}

input UpdateProjectInput {
  description: String
  leadId: ID

  """Replaces the full member list"""
  memberIds: [ID!]
  name: String
  priority: ProjectPriority
  startDate: Date
  status: ProjectStatus
  targetDate: Date
}

input UpdateReleaseInput {
  description: String
  name: String
  status: ReleaseStatus
  targetDate: Date
  version: String
}

input UpdateReleasePipelineInput {
  name: String
  type: ReleasePipelineType
}

input UpdateRequestInput {
  """Pass null to unassign"""
  customerId: ID
  description: String
  requestor: String
  source: RequestSource
  status: RequestStatus
  title: String
}

type User {
  color: String!
  createdAt: DateTime!
  email: String!
  id: ID!
  name: String!
  role: UserRole!
}

enum UserRole {
  ADMIN
  GUEST
  MEMBER
}
